[project]
name = "knowledge-forge"
version = "0.1.0"
description = "A local-first, evidence-grounded personal knowledge system."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "lancedb>=0.18,<1.0",
  "youtube-transcript-api>=1.2,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.7,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["knowledge_forge*"]

[tool.ruff]
line-length = 100
